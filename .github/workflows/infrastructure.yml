name: AKS CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BICEP_VERSION: v0.48.1

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Bicep compiler
        run: az bicep install --version "$BICEP_VERSION"

      - name: Compile and lint templates and parameters
        run: |
          mkdir -p build
          az bicep build --file infra/main.bicep --outfile build/main.json
          az bicep build-params --file infra/main.bicepparam --outfile build/main.parameters.json
          az bicep build --file infra/github-oidc.bicep --outfile build/github-oidc.json

      - name: Check infrastructure requirements
        run: python3 -m unittest discover --start-directory tests --verbose

  deploy:
    name: Deploy to Azure
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    concurrency:
      group: azure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check deployment configuration
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" || -z "$AZURE_SUBSCRIPTION_ID" || -z "$AZURE_RESOURCE_GROUP" ]]; then
            echo "::error::Set AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and AZURE_RESOURCE_GROUP in the production environment. See README.md."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Bicep compiler
        run: az bicep install --version "$BICEP_VERSION"

      - name: Verify target resource group
        run: az group show --name "$AZURE_RESOURCE_GROUP" --output none

      - name: Preview infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name aks-infrastructure \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam \
            --mode Incremental \
            --only-show-errors

      - name: Record deployment outputs
        run: |
          {
            echo '## Azure deployment outputs'
            echo '```json'
            az deployment group show \
              --name aks-infrastructure \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.outputs \
              --output json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
